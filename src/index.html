<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Gambit</title>
<meta name="theme-color" content="#8b5e3c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/chessground.css">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--ink:#3b2a1d;--hdr:#8b5e3c;--deep:#5c3d24;--paper:#ffffff;--soft:#fbf6ef;--light:#f0d9b5;--dark:#b58863;--green:#5f8a3a;--gold:#b58863;--red:#b5452f;--blue:#8b5e3c;--muted:#8a7360;--card:#fff;--line:#ecdcc6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
button{font:inherit}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
.hero{display:flex;gap:14px;align-items:center;background:var(--hdr);color:#fff;border-radius:20px;padding:16px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;opacity:.07;background:repeating-conic-gradient(#fff 0 25%,transparent 0 50%) 0 0/36px 36px}
.avatar{position:relative;width:64px;height:64px;flex:none;border-radius:16px;background:var(--light);display:grid;place-items:center;box-shadow:inset 0 -4px 0 var(--dark)}
.avatar svg{width:52px;height:52px}
.hinfo{flex:1;min-width:0;position:relative}
.pname{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank{font-size:14px;opacity:.85;font-weight:700}
.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.15);margin:7px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--light),#fff);border-radius:9px;transition:width .6s}
.small{font-size:12.5px;opacity:.8}
.streak{position:relative;text-align:center;flex:none;background:rgba(255,255,255,.08);border-radius:14px;padding:8px 10px}
.streak b{display:block;font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:22px}
.streak span{font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:.06em}
.banner{margin:10px 0 0;padding:10px 12px;border-radius:12px;font-size:13.5px;background:var(--soft);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.card h2{font-size:19px;margin-bottom:10px}
.sub{color:var(--muted);font-size:14px}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.chip{border:0;border-radius:12px;padding:8px 2px;font-size:12px;font-weight:800;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.chip:nth-child(odd){background:var(--light)}.chip:nth-child(even){background:var(--dark);color:#fff}
.chip svg{width:28px;height:28px}
.chip.on{outline:3px solid var(--deep);outline-offset:1px}
.chip.done:after{content:"✓";position:absolute;top:-6px;right:-4px;background:var(--deep);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:grid;place-items:center}
.mod{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.mod .g{width:52px;height:52px;border-radius:14px;background:var(--light);display:grid;place-items:center;flex:none}
.mod .g svg{width:44px;height:44px}
.mod h3{font-size:18px}
label.row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer;font-size:15px}
label.row input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--hdr);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:16px;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;width:100%}
.fld textarea{min-height:64px;resize:vertical}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;font-size:16px;cursor:pointer;background:var(--hdr);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.go{background:var(--deep);width:100%;font-size:17px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.btn.play{background:var(--dark);color:#fff;width:100%;font-size:18px;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15);margin-bottom:8px}
.btn.ghost{background:#fff;color:var(--deep);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.warn{background:var(--red)}
.btn.blue{background:var(--hdr)}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btns .btn{flex:1}
.cb{display:none;margin:10px 0;padding:12px;border-radius:12px;background:#fde7e3;border:1px solid #f1b3a7}
.cb.show{display:block}
.cb b{color:var(--red)}
.note{font-size:13px;color:var(--muted);margin:6px 0}
.hint{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.prefill{background:#fdf3e4;border:1px solid var(--light);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 10px}
.wboard{display:grid;grid-template-columns:repeat(6,1fr);border-radius:12px;overflow:hidden;border:3px solid var(--deep)}
.sq6{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.sq6:nth-child(odd){background:var(--light)}.sq6:nth-child(even){background:var(--dark);color:#fff}
.sq6 svg{width:60%;height:auto}
.sq6.empty svg{opacity:.18}
.sq6.today{box-shadow:inset 0 0 0 3px var(--deep)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:22px}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.heat{display:grid;grid-template-columns:70px repeat(6,1fr);gap:4px;font-size:12px;align-items:center}
.heat .c{height:22px;border-radius:6px;background:#f3ebdf}
.heat .c.d{background:var(--hdr)}.heat .c.x{background:var(--light)}.heat .c.m{background:#f3d1ca}
.heat .lbl{color:var(--muted);font-weight:700}
.prog{height:16px;border-radius:9px;background:#f3ebdf;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--dark);border-radius:9px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ok{color:var(--green);font-weight:800}.bad{color:var(--red);font-weight:800}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;background:#fff}
.badge .g{font-size:34px;width:60px;height:60px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--light),var(--dark));box-shadow:0 3px 0 var(--hdr)}
.badge .g svg{width:42px;height:42px}
.badge.lock{opacity:.55}.badge.lock .g{background:#f1ebe3;box-shadow:none;filter:grayscale(1)}
.badge b{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;display:block}
.badge span{font-size:12.5px;color:var(--muted)}
.hist{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hist .g{width:40px;height:40px;border-radius:10px;background:var(--light);display:grid;place-items:center;flex:none}
.hist .g svg{width:32px;height:32px}
.hist .m{flex:1;min-width:0}
.hist .m div:first-child{font-weight:800}
.hist .m div+div{font-size:13px;color:var(--muted)}
.xp{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;color:var(--hdr);white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--hdr);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav .in{display:flex;max-width:720px;width:100%}
nav a{flex:1;text-align:center;color:#fff;opacity:.6;text-decoration:none;font-size:11px;font-weight:800;padding:6px 0;border-radius:12px}
nav a .g{display:block;font-size:20px;line-height:1.15}
nav a.on{opacity:1;background:rgba(255,255,255,.16)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--deep);color:#fff;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;padding:12px 18px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transition:.3s;z-index:20;max-width:92vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
details summary{cursor:pointer;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:17px}
details ul{margin:8px 0 0;padding-left:20px;font-size:14px}
details li{margin:6px 0}
.chart{width:100%;height:auto;display:block;margin-top:8px}
/* ---- chessboard (lichess chessground, brown board, cburnett pieces) ---- */
.cgbox{position:relative;width:100%;max-width:min(540px,calc(100vh - 230px));min-width:250px;margin:0 auto;padding:0 0 20px 18px;touch-action:none}
.cgbox .cg-wrap{width:100%;aspect-ratio:1/1;box-shadow:0 0 0 2px var(--hdr),0 2px 8px rgba(92,61,36,.25)}
.cgbox .cg-wrap coords{opacity:1;font-family:Nunito,system-ui,sans-serif;font-size:12px;font-weight:800}
.cgbox .cg-wrap coords coord{color:var(--hdr)!important;text-shadow:none!important}
.cgbox .cg-wrap coords.ranks{left:-18px;top:0;width:14px;height:100%;align-items:center}
.cgbox .cg-wrap coords.ranks coord{transform:none;display:flex;align-items:center;justify-content:center}
.cgbox .cg-wrap coords.files{left:0;bottom:-20px;width:100%;height:18px;text-transform:none}
.cgbox .cg-wrap coords.files coord{display:flex;align-items:center;justify-content:center}

cg-board square.good{background:rgba(60,141,90,.55)}
cg-board square.bad{background:rgba(207,79,59,.55)}
cg-board square.target{background:rgba(92,61,36,.55)}
.promo-choice{position:absolute;inset:0;z-index:205;background:rgba(250,250,250,.7)}
.promo-choice square{position:absolute;width:12.5%;height:12.5%;cursor:pointer;border-radius:50%;background:#b0b0b0;box-shadow:inset 0 0 25px 3px #808080;transition:.2s}
.promo-choice square:hover{border-radius:0;background:#d85000;box-shadow:inset 0 0 48px 8px #a43e00}
.promo-choice square piece{position:absolute;left:0;top:0;width:100%!important;height:100%!important;transform:scale(.8)!important;pointer-events:none;opacity:1}
/* ---- lessons ---- */
.lhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lhead h2{font-size:20px;flex:1}
.back{border:0;background:#fff;border:1px solid var(--line);border-radius:12px;width:42px;height:42px;font-size:20px;cursor:pointer;flex:none}
.lbar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13.5px;font-weight:800;white-space:nowrap}
.pill.g{background:#eef3e6;border-color:#cfdcbb;color:#3f5f22}.pill.r{background:#fbe4df;border-color:#f1b3a7;color:#8f2a1a}.pill.y{background:#fdf3e4;border-color:var(--light)}
.msg{min-height:48px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:15px;font-weight:700;text-align:center}
.msg.ok{background:#eef3e6;border-color:#cfdcbb;color:#3f5f22}.msg.no{background:#fbe4df;border-color:#f1b3a7;color:#8f2a1a}.msg.info{background:var(--soft);border-color:var(--line);color:var(--deep)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px;font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:20px;font-weight:600;cursor:pointer;color:var(--ink)}
.opt.right{border-color:var(--green);background:#eef3e6}.opt.wrong{border-color:var(--red);background:#fbe4df}
.btext{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:17px;line-height:1.6}
.btext b{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(59,42,29,.5);display:grid;place-items:center;z-index:30;padding:16px}
.overlay .card{max-width:420px;margin:0;text-align:center}
.mlist{max-height:180px;overflow:auto;font-size:14px;line-height:1.9;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:10px}
.mlist span{cursor:pointer;padding:2px 4px;border-radius:6px}
.mlist span.cur{background:var(--light)}
.mlist span.tag{color:var(--red);font-weight:800}
.mlist span.nt{text-decoration:underline dotted}
.clocks{display:flex;gap:8px;margin:8px 0}
.clock{flex:1;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:24px;font-weight:600}
.clock.on{border-color:var(--hdr);background:#fdf3e4}.clock.low{color:var(--red)}
.clock small{display:block;font-family:Nunito;font-size:11px;color:var(--muted);font-weight:800}
.evals{display:flex;gap:4px;flex-wrap:wrap}
.evals button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-weight:800;cursor:pointer;min-width:44px}
.evals button.on{background:var(--hdr);color:#fff;border-color:var(--hdr)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.item b{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:16px}
.item .sub{font-size:13px}
.item .tick{margin-left:auto;font-weight:800;color:var(--hdr)}
.seg{display:flex;background:#f3ebdf;border-radius:12px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px;font-weight:800;cursor:pointer;color:var(--ink)}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.credits{font-size:11.5px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.5}
.credits a{color:inherit}
@media (max-width:420px){.chip{font-size:10.5px}.chip svg{width:24px;height:24px}}

/* ===== kid-friendly layer (board untouched) ===== */
html,body{font-size:17px}
body{background:#fff radial-gradient(#f3e7d6 1.2px,transparent 1.4px) 0 0/22px 22px}
.wrap{padding-top:10px}
.card{border-radius:26px;border:2px solid var(--line);box-shadow:0 4px 0 #f1e4d2;padding:18px}
.card h2{font-size:21px}
.btn{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;border-radius:18px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.btn.ghost{box-shadow:inset 0 -3px 0 var(--line);border:2px solid var(--line)}
.btn.sm{border-radius:14px;padding:9px 13px;font-size:15px}
.btn.big{font-size:21px;padding:16px 18px;border-radius:22px}
.btn.play{width:100%}
.btn.warn{background:var(--red)}
.langs{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}
.langs button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:13px;color:var(--hdr);cursor:pointer}
.langs button.on{background:var(--hdr);border-color:var(--hdr);color:#fff}
.hero{border-radius:28px;box-shadow:0 5px 0 var(--deep)}
.avatar{border-radius:20px;width:68px;height:68px}
.hstats{display:flex;flex-direction:column;gap:6px;position:relative}
.streak{border-radius:16px;text-decoration:none;color:#fff;display:block}
.streak.gift{background:rgba(255,255,255,.2);animation:wig 2.4s ease-in-out infinite}
@keyframes wig{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-6deg)}96%{transform:rotate(6deg)}}
.mission .mrow{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.mascot{width:86px;height:86px;flex:none;animation:bob 3s ease-in-out infinite}
.mascot svg,.mascot-sm svg{width:100%;height:100%}
.mascot-sm{width:84px;height:84px;margin:-6px auto 4px;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bubble{position:relative;background:var(--soft);border:2px solid var(--line);border-radius:20px;padding:12px 14px;font-size:16px;line-height:1.4}
.bubble:before{content:"";position:absolute;left:-11px;top:26px;border:10px solid transparent;border-right-color:var(--line);border-left:0}
.bubble:after{content:"";position:absolute;left:-8px;top:27px;border:9px solid transparent;border-right-color:var(--soft);border-left:0}
.bubble b{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:18px;color:var(--deep)}
.chips{gap:7px}
.chip{border-radius:16px;padding:9px 2px 7px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:13px}
.chip svg{width:32px;height:32px}
.chip.today:before{content:"";position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:var(--deep)}
.chip.done:after{content:"⭐";background:none;width:auto;height:auto;font-size:16px;top:-9px;right:-5px}
.chip.on{outline:3px solid var(--deep);outline-offset:2px}
.mod .g{border-radius:16px}
.mod h3{font-size:20px}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:before{content:"▸ ";color:var(--hdr)}
details[open] summary:before{content:"▾ "}
label.row{border-radius:16px;border-width:2px}
.fld input,.fld select,.fld textarea{border-radius:14px;border-width:2px}
.msg{border-radius:18px;border-width:2px;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:500;font-size:17px}
.msg.big{font-size:22px}
.msg.soh{background:#fdf3e4;border-color:var(--light)}
.pill{border-width:2px;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:500}
.opt{border-radius:18px;border-width:3px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.06)}
.item{border-radius:18px;border-width:2px}
.h3{font-size:17px;margin:14px 0 8px}
.coupon{display:flex;align-items:center;gap:12px;padding:12px;border:2px dashed var(--dark);border-radius:18px;background:var(--soft)}
.coupon.done{opacity:.6;border-style:solid;border-color:var(--line)}
.coupon .ci{font-size:34px;width:52px;height:52px;display:grid;place-items:center;background:#fff;border-radius:14px;flex:none}
.coupon .cm{flex:1;min-width:0}
.coupon .cm b{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:17px}
.empty{text-align:center;padding:18px;border:2px dashed var(--line);border-radius:18px;color:var(--muted);font-size:16px}
.prize{text-align:center}
.prizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.ptile{border:3px solid var(--dark);background:var(--soft);border-radius:22px;padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.08);animation:pop .4s ease-out both}
.ptile .pi{font-size:46px;line-height:1}
.ptile b{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:16px}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.addprize{display:flex;gap:8px;margin-top:12px}
.addprize input{font:inherit;border:2px solid var(--line);border-radius:14px;padding:9px 10px;min-width:0}
.addprize input[name=icon]{width:58px;text-align:center;font-size:20px}
.addprize input[name=name]{flex:1}
.danger{border-color:#f1c9bf;box-shadow:0 4px 0 #f6dcd5}
.bigin{width:100%;font:inherit;font-size:22px;font-family:Fredoka,Nunito,system-ui,sans-serif;text-align:center;letter-spacing:.08em;border:3px solid var(--line);border-radius:16px;padding:10px;margin:8px 0}
.overlay .card{animation:pop .3s ease-out both}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.tpc{width:26px;height:26px;vertical-align:middle}
.seg button small{font-weight:600;color:var(--muted);font-size:11px}
.badge{border-radius:22px;border-width:2px}
.stat{border-radius:16px}
nav{border-radius:22px 22px 0 0}
nav a .g{font-size:22px}
.lhead h2{font-size:22px}
.back{border-radius:16px;border-width:2px;box-shadow:inset 0 -3px 0 var(--line)}
.toast{border-radius:20px;font-size:17px}
</style>
</head>
<body>
<!--SPRITE-->
<div id="root"></div>
<script src="lib/chess.js"></script>
<script src="lib/chessground.js"></script>
<script src="app.js"></script>
<script src="pwa.js" defer></script>
</body>
</html>
